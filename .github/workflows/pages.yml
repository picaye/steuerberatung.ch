name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gate — tax engine tests (AGENTS.md working contract)
        # AGENTS.md declares these gates; without them here, any push to main
        # shipped to Pages even when the engine tests failed. Non-zero exit
        # fails the job BEFORE any artifact is built or deployed.
        run: node scripts/test_tax_engine.js
      - name: Gate — whole-site validator (lang mirrors, hreflang, links)
        # Replaces the need for agents to remember to run this locally; the
        # hand-rolled wc -l mirror check below stays as a build-artifact
        # sanity net. stdlib-only script, no pip install needed.
        run: python3 scripts/validate_site.py
      - name: Gate — draft-leak regression guards (t_b76643d1)
        # grenzg draft-leak saga had three untested guard patches; this suite
        # (noindex / status:pending / untracked in mksitemap + gen_latest)
        # fails the deploy if any guard regresses. stdlib-only, no pip.
        run: python3 scripts/test_draft_leak_guards.py
      - name: Build public dist (exclude private data + server files)
        run: |
          mkdir -p dist/en dist/fr dist/it dist/assets
          cp *.html dist/
          # All language mirrors must ship. Previously only en/ was copied, so
          # fr/ and it/ survived solely as leftovers of an older deployment and
          # would have vanished on any clean publish.
          cp en/*.html dist/en/
          cp fr/*.html dist/fr/
          cp it/*.html dist/it/
          # All static assets, not just css/js: the logo, favicons and the
          # og:image are referenced from every page's <head>.
          cp assets/* dist/assets/
          cp sitemap.xml robots.txt dist/
      - name: Fail if a language mirror is incomplete
        run: |
          for d in en fr it; do
            n=$(ls dist/$d/*.html 2>/dev/null | wc -l)
            root=$(ls dist/*.html | wc -l)
            if [ "$n" -lt "$root" ]; then
              echo "::error::$d has $n pages but root has $root — the $d mirror is incomplete"
              exit 1
            fi
            echo "$d: $n pages (root: $root)"
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"
      - name: Wait for previous Pages deployment to settle
        run: |
          # Back-to-back pushes: the PREVIOUS run's Pages deployment can still
          # be in progress when this run reaches the deploy step, and
          # deploy-pages then fails hard with HTTP 400 "due to in progress
          # deployment" (run 37463967336 attempt 1, 2026-10-06). The Actions
          # concurrency group serialises the workflow runs, but the Pages
          # deployment outlives its run, so the group alone cannot prevent
          # this. Poll until the newest github-pages deployment is no longer
          # queued/in_progress before creating ours. gh picks up GITHUB_TOKEN
          # from the step environment automatically.
          for i in $(seq 1 20); do
            dep=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=1" --jq '.[0].id // empty')
            if [ -z "$dep" ]; then echo "no previous deployment found"; break; fi
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$dep/statuses?per_page=1" --jq '.[0].state // "unknown"')
            echo "previous deployment $dep state: $state (poll $i/20)"
            case "$state" in
              queued|in_progress) sleep 15 ;;
              *) break ;;
            esac
            if [ "$i" -eq 20 ]; then
              echo "::error::previous Pages deployment $dep still $state after 5 minutes"
              exit 1
            fi
          done
        continue-on-error: true
      - name: Deploy to GitHub Pages
        # Do NOT "fix" a failed deploy by re-running the workflow run: a
        # re-run uploads a SECOND 'github-pages' artifact for the same run and
        # deploy-pages then dies with "Multiple artifacts named github-pages
        # were unexpectedly found" (attempt 2 of run 37463967336). That
        # collision is an artefact of re-running, not of pushing — push a
        # follow-up commit (or workflow_dispatch) instead.
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Purge Cloudflare cache for changed assets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          # app.js/endpoint.js are served with max-age=14400, so without a purge
          # a deploy stays invisible at the edge for up to 4 hours.
          #
          # No `if` on the secret here: GitHub does not allow `secrets` in
          # step conditions and rejects the whole workflow (0 jobs) if you try.
          # Guard inside the script instead and stay non-fatal when the token
          # is absent, so a missing secret can never break a deploy.
          if [ -z "${CF_TOKEN}" ] || [ -z "${CF_ZONE}" ]; then
            echo "Cloudflare secrets not configured — skipping cache purge."
            exit 0
          fi
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://steuerberatung.ch/assets/app.js","https://steuerberatung.ch/assets/endpoint.js","https://steuerberatung.ch/assets/style.css","https://steuerberatung.ch/assets/extra.css","https://steuerberatung.ch/assets/redesign.css","https://steuerberatung.ch/assets/track.js"]}' \
            | head -c 400
        continue-on-error: true
