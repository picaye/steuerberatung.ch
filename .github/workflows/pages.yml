name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 2 so the post-deploy IndexNow step can diff HEAD^..HEAD
          # to find the changed pages. Default (1) would hide the parent commit.
          fetch-depth: 2
      - name: Gate — tax engine tests (AGENTS.md working contract)
        # AGENTS.md declares these gates; without them here, any push to main
        # shipped to Pages even when the engine tests failed. Non-zero exit
        # fails the job BEFORE any artifact is built or deployed.
        run: node scripts/test_tax_engine.js
      - name: Gate — whole-site validator (lang mirrors, hreflang, links)
        # Replaces the need for agents to remember to run this locally; the
        # hand-rolled wc -l mirror check below stays as a build-artifact
        # sanity net. stdlib-only script, no pip install needed.
        run: python3 scripts/validate_site.py
      - name: Gate — draft-leak regression guards (t_b76643d1)
        # grenzg draft-leak saga had three untested guard patches; this suite
        # (noindex / status:pending / untracked in mksitemap + gen_latest)
        # fails the deploy if any guard regresses. stdlib-only, no pip.
        run: python3 scripts/test_draft_leak_guards.py
      - name: Gate — publish queue integrity (pin/hold_until, gh#6)
        # Read-only assertion (gh#6): a pending card with priority
        # pin-YYYY-MM-DD must carry a matching hold_until, or the publish
        # cron's 6-day rule cannot protect it. This defect recurred 3x
        # (b2e19d6 revert, 16bbe2d, e4d494f backfills). The gate fails the
        # job — it never auto-fixes the queue; the research cron repairs
        # its own appends before pushing.
        run: python3 scripts/validate_queue.py
      - name: Build public dist (exclude private data + server files)
        run: |
          mkdir -p dist/en dist/fr dist/it dist/assets
          cp *.html dist/
          # All language mirrors must ship. Previously only en/ was copied, so
          # fr/ and it/ survived solely as leftovers of an older deployment and
          # would have vanished on any clean publish.
          cp en/*.html dist/en/
          cp fr/*.html dist/fr/
          cp it/*.html dist/it/
          # All static assets, not just css/js: the logo, favicons and the
          # og:image are referenced from every page's <head>.
          cp assets/* dist/assets/
          # sitemap.xml explicitly (it is .xml, NOT .txt — a `cp *.txt` glob
          # silently dropped it and the live site 404'd, t_eed3b4cd) plus all
          # root .txt files: robots.txt AND the IndexNow verification key
          # file <key>.txt — the latter must be served at the site root or
          # every ping is accepted (HTTP 200) yet silently dropped at the
          # keyLocation check. It survived earlier deploys only as a
          # leftover artifact; a clean publish deleted it (t_32a2a8c3).
          cp sitemap.xml sitemap-*.xml *.txt dist/
      - name: Fail if a language mirror is incomplete
        run: |
          for d in en fr it; do
            n=$(ls dist/$d/*.html 2>/dev/null | wc -l)
            # 404.html is a single root-only error page by design (t_3b546302):
            # GitHub Pages serves /404.html for EVERY missing URL regardless of
            # language, so it has no en/fr/it mirror. Count it out of the root
            # baseline or this gate would fail on it forever.
            root=$(ls dist/*.html | grep -vc '^dist/404\.html$')
            if [ "$n" -lt "$root" ]; then
              echo "::error::$d has $n pages but root has $root — the $d mirror is incomplete"
              exit 1
            fi
            echo "$d: $n pages (root: $root)"
          done
      - name: Fail if sitemap.xml is missing or truncated
        run: |
          # t_eed3b4cd: commit 46c37b7 swapped `cp sitemap.xml robots.txt`
          # for `cp *.txt` and sitemap.xml (.xml) silently vanished from
          # dist — a green deploy 404'd the sitemap live. Assert the file
          # ships and is non-trivial before the artifact is uploaded.
          if [ ! -f dist/sitemap.xml ]; then
            echo "::error::dist/sitemap.xml is missing — the build dropped the sitemap"
            exit 1
          fi
          locs=$(cat dist/sitemap.xml dist/sitemap-*.xml 2>/dev/null | grep -c '<loc>')
          if [ "$locs" -lt 150 ]; then
            echo "::error::dist/sitemap.xml has only $locs <loc> entries (<150) — sitemap truncated"
            exit 1
          fi
          echo "sitemap.xml OK: $locs <loc> entries"
      - name: Fail if 404.html is missing or empty
        run: |
          # t_b462b318: the custom 404 page (t_3b546302) only works if
          # dist/404.html actually ships — without it GitHub Pages silently
          # falls back to the generic error page and the build stays green.
          # Same failure class as the sitemap drop (46c37b7, t_eed3b4cd): an
          # edit to the copy step above could revert the site to GitHub's
          # default 404 with zero CI signal. The mirror gate only EXEMPTS
          # 404.html from the count (grep -vc) — it never asserts it exists.
          if [ ! -f dist/404.html ]; then
            echo "::error::dist/404.html is missing — the build dropped the custom 404 page"
            exit 1
          fi
          if [ ! -s dist/404.html ]; then
            echo "::error::dist/404.html is empty — the custom 404 page would render as a blank error"
            exit 1
          fi
          echo "404.html OK: $(wc -c < dist/404.html) bytes"
      - name: Fail if search assets are missing or empty
        run: |
          # t_4e7c309f: the four search pages (suche/search/recherche/ricerca,
          # ce910fc) are inert without dist/assets/search-index.js (the whole
          # ~600KB article index) and dist/assets/search.js (the client). Both
          # ship only through `cp assets/* dist/assets/` in the build step
          # above — an edit that drops either one kills all four search pages
          # while CI stays green. Same failure class as the sitemap drop
          # (46c37b7, t_eed3b4cd) and the 404 page (t_b462b318): assert the
          # artifacts exist AND are non-empty before the artifact is uploaded.
          for f in dist/assets/search-index.js dist/assets/search.js; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing — the build dropped a search asset and every search page would be dead"
              exit 1
            fi
            if [ ! -s "$f" ]; then
              echo "::error::$f is empty — search would load but never work"
              exit 1
            fi
            echo "$f OK: $(wc -c < "$f") bytes"
          done
      - name: Fail if an article lacks trust markers (sources + dateModified)
        run: |
          # t_b2b22307: the trust package (f900cad, 2026-10-17) gave every
          # article page a Quellen/Sources/Fonti section with verified
          # official links and a dateModified field — 35/35/35/35 verified
          # by sweep 218 — but nothing in CI protects that state. A build/
          # copy regression or an article generated from an older template
          # can silently strip them; legal trust content must not rot.
          # Same failure class as the sitemap drop (t_eed3b4cd), the 404
          # page (t_b462b318) and the search assets (t_4e7c309f).
          # Fail-closed by EXEMPTION LIST, not by schema sniffing: every
          # html in dist must carry both markers unless its filename is
          # listed below — so a new article without markers fails, and a
          # new non-article page must be added to the list on purpose.
          # The four search pages have per-language names (suche/search/
          # recherche/ricerca); all are exempt.
          EXEMPT=" 3a-rechner.html 404.html agb.html datenschutz.html impressum.html index.html kontakt.html leistungen.html partner-pruefung.html ratgeber.html rechner.html recherche.html ricerca.html search.html suche.html werbung.html "
          fail=0
          check_dir() { # $1 = dir, $2 = language sources-heading text
            local checked=0 missing=0 base
            for f in "$1"/*.html; do
              base=$(basename "$f")
              case "$EXEMPT" in
                *" $base "*) continue ;;
              esac
              checked=$((checked+1))
              if ! grep -q 'dateModified' "$f"; then
                echo "::error::$f lacks dateModified — article shipped without the trust-package field"
                missing=$((missing+1)); fail=1
              fi
              if ! grep -q ">$2<" "$f"; then
                echo "::error::$f lacks the $2 heading — article shipped without its sources section"
                missing=$((missing+1)); fail=1
              fi
            done
            echo "$1: $checked article pages checked for trust markers ($missing missing)"
          }
          check_dir dist Quellen
          check_dir dist/en Sources
          check_dir dist/fr Sources
          check_dir dist/it Fonti
          [ "$fail" -eq 0 ] || exit 1
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"
      - name: Wait for previous Pages deployment to settle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Back-to-back pushes: the PREVIOUS run's Pages deployment can still
          # be in progress when this run reaches the deploy step, and
          # deploy-pages then fails hard with HTTP 400 "due to in progress
          # deployment" (run 37463967336 attempt 1, 2026-10-06). The Actions
          # concurrency group serialises the workflow runs, but the Pages
          # deployment outlives its run, so the group alone cannot prevent
          # this. Poll until the newest github-pages deployment is no longer
          # queued/in_progress before creating ours. gh picks up GITHUB_TOKEN
          # from the step environment automatically.
          for i in $(seq 1 20); do
            dep=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=1" --jq '.[0].id // empty')
            if [ -z "$dep" ]; then echo "no previous deployment found"; break; fi
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$dep/statuses?per_page=1" --jq '.[0].state // "unknown"')
            echo "previous deployment $dep state: $state (poll $i/20)"
            case "$state" in
              queued|in_progress) sleep 15 ;;
              *) break ;;
            esac
            if [ "$i" -eq 20 ]; then
              echo "::error::previous Pages deployment $dep still $state after 5 minutes"
              exit 1
            fi
          done
        continue-on-error: true
      - name: Deploy to GitHub Pages
        # Do NOT "fix" a failed deploy by re-running the workflow run: a
        # re-run uploads a SECOND 'github-pages' artifact for the same run and
        # deploy-pages then dies with "Multiple artifacts named github-pages
        # were unexpectedly found" (attempt 2 of run 37463967336). That
        # collision is an artefact of re-running, not of pushing — push a
        # follow-up commit (or workflow_dispatch) instead.
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Purge Cloudflare cache for changed assets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          # app.js/endpoint.js are served with max-age=14400, so without a purge
          # a deploy stays invisible at the edge for up to 4 hours.
          #
          # No `if` on the secret here: GitHub does not allow `secrets` in
          # step conditions and rejects the whole workflow (0 jobs) if you try.
          # Guard inside the script instead and stay non-fatal when the token
          # is absent, so a missing secret can never break a deploy.
          if [ -z "${CF_TOKEN}" ] || [ -z "${CF_ZONE}" ]; then
            echo "Cloudflare secrets not configured — skipping cache purge."
            exit 0
          fi
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://steuerberatung.ch/assets/app.js","https://steuerberatung.ch/assets/endpoint.js","https://steuerberatung.ch/assets/style.css","https://steuerberatung.ch/assets/extra.css","https://steuerberatung.ch/assets/redesign.css","https://steuerberatung.ch/assets/track.js"]}' \
            | head -c 400
        continue-on-error: true
      - name: IndexNow ping changed pages
        # t_32a2a8c3: the grenzgänger article shipped live via the manual-slot
        # chain (dev guard-drop -> Foreman gate -> CTO host push) and was never
        # pinged — the ping only lived in the publish cron's prompt, so the
        # manual path could skip it. This step makes it structural: every
        # deploy pings the html pages the push changed. Non-fatal by design
        # (same pattern as the Cloudflare purge above): a ping failure must
        # never fail an otherwise-green deploy.
        run: |
          KEY_FILE=$(git ls-files | grep -E '^[0-9a-f]{32}\.txt$' | head -1)
          if [ -z "$KEY_FILE" ]; then
            echo "no committed IndexNow key file — skipping ping."
            exit 0
          fi
          if ! git rev-parse -q --verify 'HEAD^' >/dev/null; then
            echo "no parent commit available (shallow/first commit) — skipping ping."
            exit 0
          fi
          changed=$(git diff --name-only 'HEAD^' HEAD -- '*.html')
          if [ -z "$changed" ]; then
            echo "no html pages changed in this push — skipping ping."
            exit 0
          fi
          urls=$(echo "$changed" | sed 's|^|https://steuerberatung.ch/|')
          echo "IndexNow pinging:"; echo "$urls"
          INDEXNOW_KEY="${KEY_FILE%.txt}" python3 scripts/indexnow_ping.py $urls
        continue-on-error: true
